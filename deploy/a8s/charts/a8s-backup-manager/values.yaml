namespace: a8s-system
replicaCount: 1

# Set by the parent umbrella chart to its dependency alias (e.g.
# "a8sBackupOperator."). Leave empty for standalone installs. Only affects the
# value paths printed in validation error messages, so they point at the key the
# user actually edits. Not a functional setting.
umbrellaValuePathPrefix: ""

crd:
  enable: true
  keep: true

image:
  repository: public.ecr.aws/w5n9a2g2/a9s-ds-for-k8s/dev/backup-manager
  tag: a8555999c8c6fd7a1544c599b47f458b172eb4ca
  pullPolicy: IfNotPresent

kubeRbacProxyImage:
  repository: quay.io/brancz/kube-rbac-proxy
  tag: v0.16.0
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: a8s-backup-manager-account

controllerConfig:
  healthProbeBindAddress: :8081
  metricsBindAddress: 127.0.0.1:8080
  leaderElect: true
  backupCredentialPath: /etc/backup-store-secrets

services:
  metrics:
    port: 8443

# Backup storage configuration - Configure S3/cloud storage for backups
# Set the destination bucket in configMap and the credentials in
# secret (either inline or via an existing Secret).
backupStorageConfig:
  # ConfigMap for backup store coordinates
  configMap:
    name: a8s-backup-store-config
    # Storage provider, e.g. "AWS".
    provider: "AWS"
    # Bucket/container name. Required.
    container: ""
    # Bucket region, e.g. "eu-central-1". Required unless a custom endpoint is
    # set (e.g. for MinIO / S3-compatible storage, where region is optional).
    region: ""
    # Optional endpoint URL for S3-compatible storage.
    endpoint: ""
    # Optional path_style setting for S3-compatible storage. If endpoint is set,
    # this is automatically set to true.
    pathStyle: false

  # Credentials for accessing the backup storage.
  # Provide them inline (the chart creates the Secret named below) OR set
  # existingSecret to reference a Secret you manage yourself.
  # existingSecret takes precedence over the inline values.
  secret:
    # Name of the Secret the backup manager mounts. When credentials are
    # provided inline, the chart creates a Secret with this name.
    name: a8s-backup-storage-credentials

    # Option A - inline credentials. When set (and existingSecret is empty),
    # the chart creates the Secret above with keys access-key-id,
    # secret-access-key and encryption-password.
    accessKeyId: ""
    secretAccessKey: ""
    encryptionPassword: ""

    # Option B - reference an existing Secret instead of providing credentials
    # inline. Takes precedence over the inline values above.
    existingSecret: ""
    # Keys within existingSecret. Defaults match the chart-created Secret.
    accessKeyIdKey: "access-key-id"
    secretAccessKeyKey: "secret-access-key"
    encryptionPasswordKey: "encryption-password"

resources:
  manager:
    limits:
      cpu: 150m
      memory: 150Mi
    requests:
      cpu: 100m
      memory: 100Mi
  kubeRbacProxy:
    limits:
      cpu: 400m
      memory: 128Mi
    requests:
      cpu: 5m
      memory: 64Mi

nodeSelector: {}
tolerations: []
affinity: {}
