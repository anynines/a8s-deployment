apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.3
  name: backups.backups.anynines.com
spec:
  group: backups.anynines.com
  names:
    kind: Backup
    listKind: BackupList
    plural: backups
    shortNames:
      - bkp
    singular: backup
  scope: Namespaced
  versions:
    - name: v1beta3
      schema:
        openAPIV3Schema:
          description: Backup is the Schema for the backups API
          properties:
            apiVersion:
              description: |-
                APIVersion defines the versioned schema of this representation of an object.
                Servers should convert recognized schemas to the latest internal value, and
                may reject unrecognized values.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
              type: string
            kind:
              description: |-
                Kind is a string value representing the REST resource this object represents.
                Servers may infer this from the endpoint the client submits requests to.
                Cannot be updated.
                In CamelCase.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              type: string
            metadata:
              type: object
            spec:
              description: BackupSpec defines the desired state of Backup.
              properties:
                maxRetries:
                  default: Infinite
                  description: |-
                    How many times the backup will be retried before aborting.
                    Allowed values: any positive integer, or "Infinite"
                  pattern: ^\d+|Infinite$
                  type: string
                serviceInstance:
                  description:
                    ServiceInstance identifies the Data Service Instance
                    to backup.
                  properties:
                    apiGroup:
                      description: |-
                        APIGroup is the API group of the Kubernetes API resource that represents the
                        Data Service Instance to backup or restore (e.g. postgresql.anynines.com,
                        redis.anynines.com, etc...).
                      type: string
                    kind:
                      description: |-
                        Kind is the kind of the Kubernetes API resource that represents the
                        Data Service Instance to backup or restore (e.g. Postgresql, Redis,
                        etc...).
                      type: string
                    name:
                      description: |-
                        Name is the name of the Kubernetes API resource that represents the
                        Data Service Instance to backup or restore.
                      type: string
                  required:
                    - apiGroup
                    - kind
                    - name
                  type: object
              required:
                - serviceInstance
              type: object
            status:
              description: BackupStatus defines the observed state of Backup.
              properties:
                backupID:
                  description: |-
                    BackupID is the ID of the Backup; clients can use this to poll the status of the Backup at
                    the Pod identified by `PodUsedID`.
                  type: string
                conditions:
                  description: |-
                    Conditions include a set of not mutually exclusive states the Backup can be in,
                    as well as the last observed time stamp for these conditions.
                    They include "Ready", "InProgress", "UploadedToS3", "Terminating".
                  items:
                    description:
                      Condition contains details for one aspect of the current
                      state of this API Resource.
                    properties:
                      lastTransitionTime:
                        description: |-
                          lastTransitionTime is the last time the condition transitioned from one status to another.
                          This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                        format: date-time
                        type: string
                      message:
                        description: |-
                          message is a human readable message indicating details about the transition.
                          This may be an empty string.
                        maxLength: 32768
                        type: string
                      observedGeneration:
                        description: |-
                          observedGeneration represents the .metadata.generation that the condition was set based upon.
                          For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                          with respect to the current state of the instance.
                        format: int64
                        minimum: 0
                        type: integer
                      reason:
                        description: |-
                          reason contains a programmatic identifier indicating the reason for the condition's last transition.
                          Producers of specific condition types may define expected values and meanings for this field,
                          and whether the values are considered a guaranteed API.
                          The value should be a CamelCase string.
                          This field may not be empty.
                        maxLength: 1024
                        minLength: 1
                        pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                        type: string
                      status:
                        description: status of the condition, one of True, False, Unknown.
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                        type: string
                      type:
                        description: type of condition in CamelCase or in foo.example.com/CamelCase.
                        maxLength: 316
                        pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                        type: string
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    type: object
                  type: array
                lastObservationTime:
                  description: |-
                    LastObservationTime is the timestamp of the last time the Condition was
                    observed to be true.
                  format: date-time
                  type: string
                podUsedNamespacedName:
                  description: |-
                    PodUsedNamespacedName is the namespaced name of the DSI Pod to which the backup request was
                    sent.
                  type: string
                podUsedUID:
                  description:
                    PodUsedUID is the UID of the DSI Pod to which the backup
                    request was sent.
                  type: string
                retries:
                  description: Number of times the backup has been retried
                  type: integer
              type: object
          required:
            - spec
          type: object
      served: true
      storage: true
      subresources:
        status: {}
