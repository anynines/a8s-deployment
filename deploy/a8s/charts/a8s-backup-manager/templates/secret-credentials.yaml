{{- $p := include "a8s-backup-manager.valuePath" . -}}
{{- if not .Values.backupStorageConfig.secret.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.backupStorageConfig.secret.name }}
  namespace: {{ include "a8s-backup-manager.namespace" . }}
  labels:
    {{- include "a8s-backup-manager.labels" . | nindent 4 }}
type: Opaque
data:
  access-key-id: {{ required (printf "%sbackupStorageConfig.secret.accessKeyId is required (backup storage access key ID). Provide credentials inline, or set %sbackupStorageConfig.secret.existingSecret to reference a Secret you manage (expected keys: access-key-id, secret-access-key, encryption-password)." $p $p) .Values.backupStorageConfig.secret.accessKeyId | b64enc | quote }}
  secret-access-key: {{ required (printf "%sbackupStorageConfig.secret.secretAccessKey is required (backup storage secret access key). Provide credentials inline, or set %sbackupStorageConfig.secret.existingSecret." $p $p) .Values.backupStorageConfig.secret.secretAccessKey | b64enc | quote }}
  encryption-password: {{ required (printf "%sbackupStorageConfig.secret.encryptionPassword is required (used to encrypt backups at rest). Provide credentials inline, or set %sbackupStorageConfig.secret.existingSecret." $p $p) .Values.backupStorageConfig.secret.encryptionPassword | b64enc | quote }}
{{- end }}
