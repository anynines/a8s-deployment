{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ default "a8s-backup-manager-account" .Values.serviceAccount.name }}
  namespace: {{ include "a8s-backup-manager.namespace" . }}
  labels:
    {{- include "a8s-backup-manager.labels" . | nindent 4 }}
{{- end }}
