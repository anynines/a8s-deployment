{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ default "postgresql-manager-account" .Values.serviceAccount.name }}
  namespace: {{ include "a8s-postgresql-operator.namespace" . }}
  labels:
    {{- include "a8s-postgresql-operator.labels" . | nindent 4 }}
{{- end }}
