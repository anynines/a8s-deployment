apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  annotations:
    cert-manager.io/inject-ca-from: {{ include "a8s-postgresql-operator.namespace" . }}/{{ .Values.webhookCertificate.name }}
  labels:
    app.kubernetes.io/component: webhook
    app.kubernetes.io/created-by: postgresql-operator
    app.kubernetes.io/part-of: a8s-postgres
  name: postgresql-validating-webhook-configuration
webhooks:
  - admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: postgresql-webhook-service
        namespace: {{ include "a8s-postgresql-operator.namespace" . }}
        path: /validate-postgresql-anynines-com-v1beta3-postgresql
    failurePolicy: Fail
    name: vpostgresql.kb.io
    rules:
      - apiGroups:
          - postgresql.anynines.com
        apiVersions:
          - v1beta3
        operations:
          - CREATE
          - UPDATE
        resources:
          - postgresqls
    sideEffects: None
