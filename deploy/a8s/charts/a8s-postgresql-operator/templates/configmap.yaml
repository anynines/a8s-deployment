apiVersion: v1
kind: ConfigMap
metadata:
  name: postgresql-manager-config
  namespace: {{ include "a8s-postgresql-operator.namespace" . }}
  labels:
    {{- include "a8s-postgresql-operator.labels" . | nindent 4 }}
data:
  controller_manager_config.yaml: |-
    apiVersion: controller-runtime.sigs.k8s.io/v1alpha1
    kind: ControllerManagerConfig
    health:
      healthProbeBindAddress: {{ .Values.controllerConfig.healthProbeBindAddress }}
    metrics:
      bindAddress: {{ .Values.controllerConfig.metricsBindAddress }}
    webhook:
      port: {{ .Values.controllerConfig.webhookPort }}
    leaderElection:
      leaderElect: {{ ternary "true" "false" .Values.controllerConfig.leaderElect }}
      resourceName: {{ .Values.controllerConfig.leaderElectionResourceName }}
