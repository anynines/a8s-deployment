{{- $namespace := include "a8s-service-binding-controller.namespace" . -}}
{{- $saName := default "service-binding-manager-account" .Values.serviceAccount.name -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-binding-controller-manager
  namespace: {{ $namespace }}
  labels:
    app.kubernetes.io/component: controller-manager
    app.kubernetes.io/created-by: a8s-service-binding-controller
    app.kubernetes.io/instance: controller-manager
    app.kubernetes.io/managed-by: helm
    app.kubernetes.io/name: service-binding-controller-manager
    app.kubernetes.io/part-of: a8s-service-binding
    control-plane: controller-manager
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: controller-manager
      app.kubernetes.io/name: service-binding-controller-manager
      app.kubernetes.io/part-of: a8s-service-binding
      control-plane: controller-manager
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
        prometheus.io/port: "{{ .Values.service.port }}"
        prometheus.io/scrape: "true"
      labels:
        app.kubernetes.io/component: controller-manager
        app.kubernetes.io/name: service-binding-controller-manager
        app.kubernetes.io/part-of: a8s-service-binding
        control-plane: controller-manager
    spec:
      serviceAccountName: {{ $saName }}
      terminationGracePeriodSeconds: 10
      containers:
        - name: manager
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --config=/config/controller_manager_config.yaml
            - --postgresql-root-role={{ .Values.controllerConfig.postgresqlRootRole }}
            - --postgresql-default-database={{ .Values.controllerConfig.postgresqlDefaultDatabase }}
            - --enable-integration={{ index .Values.controllerConfig "enable-integration" }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources.manager | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: manager-config
              mountPath: /config/controller_manager_config.yaml
              subPath: controller_manager_config.yaml
        - name: kube-rbac-proxy
          image: {{ printf "%s:%s" .Values.kubeRbacProxyImage.repository .Values.kubeRbacProxyImage.tag }}
          imagePullPolicy: {{ .Values.kubeRbacProxyImage.pullPolicy }}
          args:
            - --secure-listen-address=0.0.0.0:8443
            - --upstream=http://127.0.0.1:8080/
            - --logtostderr=true
            - --v=0
          ports:
            - containerPort: 8443
              name: https
              protocol: TCP
          resources:
            {{- toYaml .Values.resources.kubeRbacProxy | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: manager-config
          configMap:
            name: service-binding-manager-config
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
